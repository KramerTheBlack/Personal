---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-share-jmx
  namespace: {{ .Release.Namespace }}
  labels:
    app: share
    name: {{ .Chart.Name }}-share-jmx
spec:
  clusterIP: "{{tpl .Values.global.clusterips.app3.share_jmx .}}"
  ports:
  - name: "10064"
    port: 10064
    targetPort: 10064
  selector:
    app: share
    name: {{ .Chart.Name }}-share
  type: NodePort
status:
  loadBalancer: {}
