---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-share
  namespace: {{ .Release.Namespace }}
  labels:
    app: share
    name: {{ .Chart.Name }}-share
spec:
  clusterIP: "{{tpl .Values.global.clusterips.app3.share .}}"
  ports:
  - name: "8080"
    port: 8080
    targetPort: 8080
  - name: "8543"
    port: 8543
    targetPort: 8543
  selector:
    app: share
    name: {{ .Chart.Name }}-share
  type: NodePort
status:
  loadBalancer: {}
