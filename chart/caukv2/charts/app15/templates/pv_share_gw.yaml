---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Chart.Name }}-share-gw
  namespace: {{ .Release.Namespace }}
  labels:
    pv: {{ .Chart.Name }}-share-gw
spec:
  capacity:
    storage: {{ .Values.global.nfs.kubestore.capacity }}
  claimRef:
    name: {{ .Chart.Name }}-share-gw
    namespace: {{ .Release.Namespace }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  nfs:
    path: {{ .Values.global.nfs.kubestore.basepath}}{{ .Chart.Name }}-share-gw
    server: {{ .Values.global.nfs.kubestore.server}}
---
# PV CLAIMS DOWNWARDS
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Chart.Name }}-share-gw
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ .Values.global.nfs.kubestore.capacity }}
  storageClassName: nfs
  selector:
    matchLabels:
      pv: {{ .Chart.Name }}-share-gw
